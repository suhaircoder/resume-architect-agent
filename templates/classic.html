<!DOCTYPE html>
<html>
<head>
    <style>
        @page { size: A4; margin: 2cm; }
        body { font-family: "Times New Roman", Times, serif; color: #000; line-height: 1.5; }
        h1 { text-align: center; text-transform: uppercase; font-size: 24px; margin-bottom: 5px; letter-spacing: 2px; }
        .contact { text-align: center; font-size: 12px; margin-bottom: 25px; border-bottom: 1px solid #000; padding-bottom: 10px; }
        h2 { font-size: 16px; text-transform: uppercase; border-bottom: 1px solid #000; margin-top: 20px; margin-bottom: 10px; }
        .section-content { font-size: 14px; text-align: justify; }
    </style>
</head>
<body>
    <h1>{{ name }}</h1>
    <div class="contact">
        {{ email }} | {{ phone }}
    </div>

    <h2>Professional Summary</h2>
    <div class="section-content">
        {{ summary }}
    </div>

    <h2>Core Competencies</h2>
    <div class="section-content">
        {{ skills }}
    </div>

    <h2>Professional Experience</h2>
    <div class="section-content">
        {{ experience }}
    </div>
</body>
</html>
